name: Build PDF

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify numerical examples
        run: python3 scripts/check-lecture02.py

      - name: Build course and lecture slides
        run: make lecture2 lecture2-original lecture3 lecture4 lecture5 lecture4-journal seminar4 seminar5 ubuntu-terminal lab-report debian-install

      - name: Prepare build metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATETIME="$(date -u +'%Y%m%d-%H%M%SZ')"

          case "$EVENT_NAME" in
            release)
              BUILD_VERSION="$RELEASE_TAG"
              ;;
            pull_request)
              BUILD_VERSION="pr-${PR_NUMBER}-build-${GITHUB_RUN_NUMBER}-${BUILD_DATETIME}-${SHORT_SHA}"
              ;;
            workflow_dispatch)
              BUILD_VERSION="manual-build-${GITHUB_RUN_NUMBER}-${BUILD_DATETIME}-${SHORT_SHA}"
              ;;
            *)
              BUILD_VERSION="master-build-${GITHUB_RUN_NUMBER}-${BUILD_DATETIME}-${SHORT_SHA}"
              ;;
          esac

          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "BUILD_DATETIME=$BUILD_DATETIME" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "PDF_NAME=adaptation_course-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "SLIDES_PDF_NAME=lecture02-slides-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "ORIGINAL_PDF_NAME=lecture02-original-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "LECTURE3_PDF_NAME=lecture03-slides-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "LECTURE4_PDF_NAME=lecture04-slides-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "JOURNAL_PDF_NAME=lecture04-journal-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "LECTURE5_PDF_NAME=lecture05-slides-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "SEMINAR4_PDF_NAME=seminar04-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "SEMINAR4_FACTORIAL_PDF_NAME=seminar04-factorial-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "SEMINAR5_PDF_NAME=seminar05-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "UBUNTU_TERMINAL_PDF_NAME=ubuntu-terminal-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "DEMO_LAB_PDF_NAME=demo-lab-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "EXAMPLE_REPORT_PDF_NAME=example-report-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "DEBIAN_INSTALL_PDF_NAME=debian-install-${BUILD_VERSION}.pdf" >> "$GITHUB_ENV"
          echo "HTML_ZIP_NAME=course-html-${BUILD_VERSION}.zip" >> "$GITHUB_ENV"

      - name: Prepare PDF artifact
        run: |
          mkdir -p dist/html dist/pdf/lecture02 dist/pdf/lecture03 dist/pdf/lecture04 dist/pdf/lecture05 dist/pdf/seminar04/factorial dist/pdf/seminar05 dist/pdf/ubuntu-terminal dist/pdf/lab-report dist/pdf/debian-install
          cp build/pdf/adaptation_course.pdf "dist/pdf/${PDF_NAME}"
          cp build/pdf/lecture02/lecture02-slides.pdf "dist/pdf/lecture02/${SLIDES_PDF_NAME}"
          cp build/pdf/lecture02/lecture02-original.pdf "dist/pdf/lecture02/${ORIGINAL_PDF_NAME}"
          cp build/pdf/lecture03/lecture03-slides.pdf "dist/pdf/lecture03/${LECTURE3_PDF_NAME}"
          cp build/pdf/lecture04/lecture04-slides.pdf "dist/pdf/lecture04/${LECTURE4_PDF_NAME}"
          cp build/pdf/lecture04/lecture04-journal.pdf "dist/pdf/lecture04/${JOURNAL_PDF_NAME}"
          cp build/pdf/lecture05/lecture05-slides.pdf "dist/pdf/lecture05/${LECTURE5_PDF_NAME}"
          cp build/pdf/seminar04/seminar04.pdf "dist/pdf/seminar04/${SEMINAR4_PDF_NAME}"
          cp build/pdf/seminar04/seminar04-factorial.pdf "dist/pdf/seminar04/${SEMINAR4_FACTORIAL_PDF_NAME}"
          cp build/pdf/seminar05/seminar05.pdf "dist/pdf/seminar05/${SEMINAR5_PDF_NAME}"
          cp build/pdf/ubuntu-terminal/ubuntu-terminal.pdf "dist/pdf/ubuntu-terminal/${UBUNTU_TERMINAL_PDF_NAME}"
          cp build/pdf/lab-report/demo-lab.pdf "dist/pdf/lab-report/${DEMO_LAB_PDF_NAME}"
          cp build/pdf/lab-report/example-report.pdf "dist/pdf/lab-report/${EXAMPLE_REPORT_PDF_NAME}"
          cp build/pdf/debian-install/debian-install.pdf "dist/pdf/debian-install/${DEBIAN_INSTALL_PDF_NAME}"
          cp -R build/pdf/lecture04/materials dist/pdf/lecture04/materials
          cp -R build/pdf/lecture05/materials dist/pdf/lecture05/materials
          cp -R build/pdf/seminar04/materials dist/pdf/seminar04/materials
          cp -R build/pdf/seminar04/factorial/materials dist/pdf/seminar04/factorial/materials
          cp -R build/pdf/seminar05/materials dist/pdf/seminar05/materials
          python3 -c 'import os, shutil; name=os.environ["BUILD_VERSION"]; shutil.make_archive("dist/pdf/lecture04/lecture04-materials-" + name, "zip", "build/pdf/lecture04/materials"); shutil.make_archive("dist/pdf/lecture05/lecture05-materials-" + name, "zip", "build/pdf/lecture05/materials"); shutil.make_archive("dist/pdf/seminar04/seminar04-materials-" + name, "zip", "build/pdf/seminar04/materials"); shutil.make_archive("dist/pdf/seminar04/seminar04-factorial-materials-" + name, "zip", "build/pdf/seminar04/factorial/materials")'
          python3 -c 'import os, shutil; name=os.environ["BUILD_VERSION"]; shutil.make_archive("dist/pdf/seminar05/seminar05-materials-" + name, "zip", "build/pdf/seminar05/materials")'
          python3 -c 'import os, shutil; shutil.make_archive("dist/html/" + os.environ["HTML_ZIP_NAME"][:-4], "zip", "build/html")'

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptation-course-${{ env.BUILD_VERSION }}
          path: dist/

      - name: Prepare Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p public/pdf/lecture02 public/pdf/lecture03 public/pdf/lecture04 public/pdf/lecture05 public/pdf/seminar04/factorial public/pdf/seminar05 public/pdf/ubuntu-terminal public/pdf/lab-report public/pdf/debian-install
          cp build/pdf/adaptation_course.pdf public/pdf/adaptation_course.pdf
          cp build/pdf/lecture02/lecture02-slides.pdf public/pdf/lecture02/
          cp build/pdf/lecture02/lecture02-original.pdf public/pdf/lecture02/
          cp build/pdf/lecture03/lecture03-slides.pdf public/pdf/lecture03/
          cp build/pdf/lecture04/lecture04-slides.pdf public/pdf/lecture04/
          cp build/pdf/lecture04/lecture04-journal.pdf public/pdf/lecture04/
          cp build/pdf/lecture05/lecture05-slides.pdf public/pdf/lecture05/
          cp build/pdf/seminar04/seminar04.pdf public/pdf/seminar04/
          cp build/pdf/seminar04/seminar04-factorial.pdf public/pdf/seminar04/
          cp build/pdf/seminar05/seminar05.pdf public/pdf/seminar05/
          cp build/pdf/ubuntu-terminal/ubuntu-terminal.pdf public/pdf/ubuntu-terminal/
          cp build/pdf/lab-report/demo-lab.pdf public/pdf/lab-report/
          cp build/pdf/lab-report/example-report.pdf public/pdf/lab-report/
          cp build/pdf/debian-install/debian-install.pdf public/pdf/debian-install/
          cp -R build/pdf/lecture04/materials public/pdf/lecture04/materials
          cp -R build/pdf/lecture05/materials public/pdf/lecture05/materials
          cp -R build/pdf/seminar04/materials public/pdf/seminar04/materials
          cp -R build/pdf/seminar04/factorial/materials public/pdf/seminar04/factorial/materials
          cp -R build/pdf/seminar05/materials public/pdf/seminar05/materials
          python3 -c 'import shutil; shutil.make_archive("public/pdf/lecture04/lecture04-materials", "zip", "build/pdf/lecture04/materials"); shutil.make_archive("public/pdf/lecture05/lecture05-materials", "zip", "build/pdf/lecture05/materials"); shutil.make_archive("public/pdf/seminar04/seminar04-materials", "zip", "build/pdf/seminar04/materials"); shutil.make_archive("public/pdf/seminar04/seminar04-factorial-materials", "zip", "build/pdf/seminar04/factorial/materials")'
          python3 -c 'import shutil; shutil.make_archive("public/pdf/seminar05/seminar05-materials", "zip", "build/pdf/seminar05/materials")'
          cp -R build/html public/html
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <title>Адаптационный курс</title>
          </head>
          <body>
            <h1>Адаптационный курс</h1>
            <p><a href="pdf/adaptation_course.pdf">Открыть актуальную версию PDF</a></p>
            <h2>Лекция №2. Кодирование данных и команд</h2>
            <p>Лекция и семинар — по 90 минут. Условия и решения семинара находятся в пособии.</p>
            <h3>Сценарий занятия на 90 минут</h3>
            <ul>
              <li><a href="html/lecture02/">Презентация Reveal.js</a></li>
              <li><a href="pdf/lecture02/lecture02-slides.pdf">Презентация в PDF</a></li>
            </ul>
            <h3>Альтернативная презентация уже прочитанной лекции — 60 слайдов</h3>
            <ul>
              <li><a href="html/lecture02/original/">Reveal.js: lecture02-original</a></li>
              <li><a href="pdf/lecture02/lecture02-original.pdf">PDF: lecture02-original</a></li>
            </ul>
            <h2>Лекция №3. Арифметика компьютера</h2>
            <ul>
              <li><a href="html/lecture03/">Презентация Reveal.js</a></li>
              <li><a href="pdf/lecture03/lecture03-slides.pdf">Презентация в PDF</a></li>
            </ul>
            <h2>Лекция №4. Как устроен компьютер и где исполняется программа</h2>
            <p>90 минут: компоненты, шины, память и кэш, прерывания, путь инструкций и данных.</p>
            <ul>
              <li><a href="html/lecture04/">Презентация Reveal.js</a></li>
              <li><a href="pdf/lecture04/lecture04-slides.pdf">Презентация в PDF</a></li>
              <li><a href="html/lecture04/materials/README.md">Состав дополнительных материалов</a></li>
              <li><a href="pdf/lecture04/lecture04-materials.zip">Скачать материалы к PDF</a></li>
            </ul>
            <h3>Сквозной пример: разработка журнала оценок группы</h3>
            <ul>
              <li><a href="html/lecture04/journal/">Презентация Reveal.js</a></li>
              <li><a href="pdf/lecture04/lecture04-journal.pdf">Презентация в PDF</a></li>
            </ul>
            <h2>Лекция №5. Операционная система и запуск программы</h2>
            <p>История пакетных систем, Unix и Windows; путь от команды shell до процесса, стандартные потоки и код завершения.</p>
            <ul>
              <li><a href="html/lecture05/">Презентация Reveal.js</a></li>
              <li><a href="pdf/lecture05/lecture05-slides.pdf">Презентация в PDF</a></li>
              <li><a href="html/lecture05/materials/README.md">Материалы и инструкция запуска</a></li>
              <li><a href="pdf/lecture05/lecture05-materials.zip">Скачать материалы к PDF</a></li>
            </ul>
            <h2>Семинар №4. Лабораторная работа на выбор</h2>
            <p>Выберите и защитите один из двух вариантов. Задания, не выполненные в аудитории, завершаются дома.</p>
            <h3>Вариант 1 (базовый): факториал на C</h3>
            <ul>
              <li><a href="html/seminar04/factorial/">Методичка: читать в браузере</a></li>
              <li><a href="pdf/seminar04/seminar04-factorial.pdf">Методичка: PDF для печати</a></li>
              <li><a href="html/seminar04/factorial/materials/README.md">Состав материалов для практики</a></li>
              <li><a href="pdf/seminar04/seminar04-factorial-materials.zip">Скачать материалы к PDF</a></li>
            </ul>
            <h3>Вариант 2 (усложнённый): загрузочный сектор и журнал</h3>
            <ul>
              <li><a href="html/seminar04/">Методичка: читать в браузере</a></li>
              <li><a href="pdf/seminar04/seminar04.pdf">Методичка: PDF для печати</a></li>
              <li><a href="html/seminar04/materials/README.md">Состав материалов для практики</a></li>
              <li><a href="pdf/seminar04/seminar04-materials.zip">Скачать материалы к PDF</a></li>
            </ul>
            <h2>Лабораторная работа №5. Git и процессы</h2>
            <p>Сначала локальный Git, затем коды возврата и изоляция процессов в Linux.</p>
            <ul>
              <li><a href="html/seminar05/">Методичка: читать в браузере</a></li>
              <li><a href="pdf/seminar05/seminar05.pdf">Методичка: PDF для печати</a></li>
              <li><a href="html/seminar05/materials/README.md">Состав материалов</a></li>
              <li><a href="pdf/seminar05/seminar05-materials.zip">Скачать материалы к PDF</a></li>
            </ul>
            <h2>Дополнительные материалы</h2>
            <h3>Установка Debian и знакомство с терминалом</h3>
            <ul>
              <li><a href="html/debian-install/">Лабораторная: читать в браузере</a></li>
              <li><a href="pdf/debian-install/debian-install.pdf">Лабораторная: PDF</a></li>
            </ul>
            <h3>Загрузка Ubuntu и первые шаги в терминале</h3>
            <ul>
              <li><a href="html/ubuntu-terminal/">Методичка: читать в браузере</a></li>
              <li><a href="pdf/ubuntu-terminal/ubuntu-terminal.pdf">Методичка: PDF для печати</a></li>
            </ul>
            <h3>Демонстрационная лабораторная: сумма двух чисел</h3>
            <ul>
              <li><a href="html/lab-report/">Лабораторная: читать в браузере</a></li>
              <li><a href="pdf/lab-report/demo-lab.pdf">Лабораторная: PDF</a></li>
              <li><a href="html/lab-report/report.html">Заполненный пример отчёта: HTML</a></li>
              <li><a href="pdf/lab-report/example-report.pdf">Заполненный пример отчёта: PDF</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/deploy-pages@v4

      - name: Attach PDF to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/pdf/${PDF_NAME}" "dist/pdf/lecture02/${SLIDES_PDF_NAME}" "dist/pdf/lecture02/${ORIGINAL_PDF_NAME}" "dist/pdf/lecture03/${LECTURE3_PDF_NAME}" "dist/pdf/lecture04/${LECTURE4_PDF_NAME}" "dist/pdf/lecture04/${JOURNAL_PDF_NAME}" "dist/pdf/lecture04/lecture04-materials-${BUILD_VERSION}.zip" "dist/pdf/lecture05/${LECTURE5_PDF_NAME}" "dist/pdf/lecture05/lecture05-materials-${BUILD_VERSION}.zip" "dist/pdf/seminar04/${SEMINAR4_PDF_NAME}" "dist/pdf/seminar04/${SEMINAR4_FACTORIAL_PDF_NAME}" "dist/pdf/seminar04/seminar04-materials-${BUILD_VERSION}.zip" "dist/pdf/seminar04/seminar04-factorial-materials-${BUILD_VERSION}.zip" "dist/pdf/seminar05/${SEMINAR5_PDF_NAME}" "dist/pdf/seminar05/seminar05-materials-${BUILD_VERSION}.zip" "dist/pdf/ubuntu-terminal/${UBUNTU_TERMINAL_PDF_NAME}" "dist/pdf/lab-report/${DEMO_LAB_PDF_NAME}" "dist/pdf/lab-report/${EXAMPLE_REPORT_PDF_NAME}" "dist/pdf/debian-install/${DEBIAN_INSTALL_PDF_NAME}" "dist/html/${HTML_ZIP_NAME}" --clobber
