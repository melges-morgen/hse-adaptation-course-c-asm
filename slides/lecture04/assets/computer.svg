<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
  <title id="title">Компоненты современного компьютера</title>
  <desc id="desc">CPU соединён с RAM каналами памяти, с GPU и NVMe SSD через PCIe, с чипсетом через соединение платформы. Через чипсет доступны SATA и USB. Реальная топология зависит от платформы.</desc>
  <g fill="none" stroke="#8bbcff" stroke-width="3"><path d="M285 80H430M650 80H790M540 120V190M790 225H650M285 225H430"/></g>
  <g fill="#25283f" stroke="#00d4aa" stroke-width="2"><rect x="5" y="35" width="280" height="85" rx="8"/><rect x="430" y="35" width="220" height="85" rx="8"/><rect x="790" y="35" width="285" height="85" rx="8"/><rect x="430" y="190" width="220" height="85" rx="8"/><rect x="5" y="190" width="280" height="85" rx="8"/><rect x="790" y="190" width="285" height="85" rx="8"/></g>
  <g fill="#f0f4f8" text-anchor="middle" font-family="Carlito, sans-serif" font-size="28"><text x="145" y="72">RAM · DRAM</text><text x="145" y="104" font-size="22">рабочая память</text><text x="540" y="72">CPU</text><text x="540" y="104" font-size="22">ядра + контроллер</text><text x="932" y="72">GPU / NVMe SSD</text><text x="932" y="104" font-size="22">вычисления / хранение</text><text x="540" y="240">Чипсет</text><text x="145" y="226">HDD / SATA SSD</text><text x="145" y="259" font-size="22">накопители</text><text x="932" y="226">USB-контроллер</text><text x="932" y="259" font-size="22">клавиатура и другое</text></g>
  <g fill="#00d4aa" text-anchor="middle" font-family="Carlito, sans-serif" font-size="23"><text x="355" y="55">DDR</text><text x="720" y="55">PCIe</text><text x="355" y="209">SATA</text><text x="720" y="209">I/O</text><text x="722" y="160">связь CPU ↔ чипсет</text></g>
</svg>
