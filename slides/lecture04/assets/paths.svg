<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
  <title id="title">Два пути: инструкции и данные</title><desc id="desc">Код и данные хранятся в RAM. При промахах запросы обслуживаются нижними уровнями кэша. Код поступает в L1I и декодер, данные в L1D и регистр EAX. АЛУ меняет регистр; запись направляется через буфер в подсистему данных.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#8bbcff" stroke-width="1.5"/></marker></defs>
  <g stroke="#8bbcff" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M190 80H289"/><path d="M190 230H289"/><path d="M470 80H569"/><path d="M470 230H569"/><path d="M740 80H819"/><path d="M740 230H819"/></g>
  <g fill="#25283f" stroke="#8bbcff" stroke-width="2"><rect x="5" y="30" width="185" height="105" rx="8"/><rect x="295" y="30" width="175" height="105" rx="8"/><rect x="575" y="30" width="165" height="105" rx="8"/><rect x="825" y="30" width="250" height="105" rx="8"/></g>
  <g fill="#25283f" stroke="#00d4aa" stroke-width="2"><rect x="5" y="180" width="185" height="105" rx="8"/><rect x="295" y="180" width="175" height="105" rx="8"/><rect x="575" y="180" width="165" height="105" rx="8"/><rect x="825" y="180" width="250" height="105" rx="8"/></g>
  <g fill="#f0f4f8" text-anchor="middle" font-family="Carlito, sans-serif" font-size="28"><text x="97" y="72">Код в RAM</text><text x="97" y="105" font-size="22">байты команд</text><text x="382" y="72">L3 / L2</text><text x="382" y="105" font-size="22">по запросу</text><text x="657" y="90">L1I</text><text x="950" y="72">Декодирование</text><text x="950" y="105" font-size="22">→ исполнение</text><text x="97" y="222">Данные</text><text x="97" y="255" font-size="22">массив в RAM</text><text x="382" y="222">L3 / L2</text><text x="382" y="255" font-size="22">по запросу</text><text x="657" y="240">L1D</text><text x="950" y="222">EAX ↔ АЛУ</text><text x="950" y="255" font-size="22">запись → буфер → L1D</text></g>
  <text x="540" y="163" fill="#b9c5d4" text-anchor="middle" font-family="Carlito, sans-serif" font-size="22">Упрощённый путь при промахах · L2/L3 могут быть общими для кода и данных</text>
</svg>
